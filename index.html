  { n:91, sym:"Pa", name:"Protactinium", cat:"actinide", g:5, p:7, mass:"231.036", state:"Solid", density:"15.37 g/cm³", mp:"1572°C", bp:"4000°C", ec:"[Rn] 5f² 6d¹ 7s²", shells:[2,8,18,32,20,9,2], en:"1.5", ox:"+5, +4", disc:"Kasimir Fajans & Otto Göhring", year:1913, desc:"Protactinium is a highly toxic and radioactive metal with no practical applications outside of research. Its name means 'before actinium' since its decay produces actinium. The world's entire supply of isolated protactinium (125 grams) exists in one container in the UK, making it more valuable per gram than any other material.", uses:["Research only","Pa-231/Ac-227 generator","Ocean floor dating (Pa/Th ratio)","No practical non-research uses"], fact:"The world's entire supply of isolated protactinium — 125 grams — is stored in a single container at the National Nuclear Laboratory in the UK, making it likely the world's most expensive material by weight." },
  { n:92, sym:"U", name:"Uranium", cat:"actinide", g:6, p:7, mass:"238.029", state:"Solid", density:"19.05 g/cm³", mp:"1135°C", bp:"4131°C", ec:"[Rn] 5f³ 6d¹ 7s²", shells:[2,8,18,32,21,9,2], en:"1.38", ox:"+6, +5, +4, +3", disc:"Martin Heinrich Klaproth", year:1789, desc:"Uranium is the heaviest naturally occurring element and the fuel for nuclear power plants and weapons. Just 3 kg of U-235 undergoes fission to release the same energy as 24 million kg of coal. Uranium also enabled the discovery of radioactivity when Henri Becquerel found its salts fogged photographic plates in 1896.", uses:["Nuclear power (electricity)","Nuclear weapons","Depleted uranium (armor/ammunition)","Age dating (uranium-lead)","Historical glass coloring (uranium glass)"], fact:"The energy density of uranium is extraordinary — one kilogram of uranium fuel releases as much energy as burning 3,000 tonnes of coal, making nuclear power the most energy-dense fuel source known." },
  { n:93, sym:"Np", name:"Neptunium", cat:"actinide", g:7, p:7, mass:"[237]", state:"Solid", density:"20.45 g/cm³", mp:"644°C", bp:"3902°C", ec:"[Rn] 5f⁴ 6d¹ 7s²", shells:[2,8,18,32,22,9,2], en:"1.36", ox:"+7, +6, +5, +4, +3", disc:"Edwin McMillan & Philip Abelson", year:1940, desc:"Neptunium was the first transuranic element ever produced and was discovered when uranium was bombarded with neutrons. Named after the planet Neptune (following uranium=Uranus), it is naturally radioactive and occurs in tiny quantities in uranium ores. It is a primary material in nuclear waste from power plants.", uses:["Np-237 as neutron detection source","Plutonium production (reactor)","Nuclear waste component","Research applications"], fact:"Neptunium was discovered at Berkeley in 1940 and was the first element ever created by humans — or at least the first to be definitively proved as a new transuranic element." },
  { n:94, sym:"Pu", name:"Plutonium", cat:"actinide", g:8, p:7, mass:"[244]", state:"Solid", density:"19.84 g/cm³", mp:"640°C", bp:"3228°C", ec:"[Rn] 5f⁶ 7s²", shells:[2,8,18,32,24,8,2], en:"1.28", ox:"+6, +5, +4, +3", disc:"Glenn T. Seaborg et al.", year:1940, desc:"Plutonium is one of the most extraordinary and dangerous materials ever made. Fissile plutonium-239 is used in nuclear weapons and as nuclear fuel. It has an unusual property — changing crystal structure six times before melting, making it notoriously difficult to machine. The Cassini-Huygens and New Horizons space probes were powered by plutonium.", uses:["Nuclear weapons","Nuclear power fuel (MOX)","RTGs (spacecraft power)","Plutonium pacemakers (historical)","Research"], fact:"Plutonium changes its crystal structure 6 different times between room temperature and its melting point — more than any other element — making it extraordinarily difficult to work with mechanically." },
  { n:95, sym:"Am", name:"Americium", cat:"actinide", g:9, p:7, mass:"[243]", state:"Solid", density:"13.67 g/cm³", mp:"1176°C", bp:"2011°C", ec:"[Rn] 5f⁷ 7s²", shells:[2,8,18,32,25,8,2], en:"1.3", ox:"+6, +5, +4, +3", disc:"Glenn T. Seaborg et al.", year:1944, desc:"Americium is the only transuranic element to find widespread everyday use. Americium-241 is used in smoke detectors — it ionizes air between two electrodes, and smoke particles disrupt this ionization, triggering the alarm. There are likely one or more americium smoke detectors in your building right now.", uses:["Smoke detectors (Am-241)","Neutron gauging (thickness)","Medical imaging sources","Am-241 batteries (research)","Gamma ray sources"], fact:"Americium-241 is in virtually every ionization smoke detector in the world — there are billions of them in use, making americium the most 'consumer' transuranic element ever produced." },
  { n:96, sym:"Cm", name:"Curium", cat:"actinide", g:10, p:7, mass:"[247]", state:"Solid", density:"13.51 g/cm³", mp:"1340°C", bp:"3110°C", ec:"[Rn] 5f⁷ 6d¹ 7s²", shells:[2,8,18,32,25,9,2], en:"1.3", ox:"+4, +3", disc:"Glenn T. Seaborg et al.", year:1944, desc:"Curium is named after Marie and Pierre Curie, the founders of radioactivity research. It is intensely radioactive and produces heat through radioactive decay, making it suitable for small nuclear batteries (RTGs). Curium-244 powered the Alpha Particle X-Ray Spectrometer (APXS) on Mars rovers, analyzing Martian soil composition.", uses:["Spacecraft RTG batteries","APXS on Mars Curiosity Rover","Alpha particle X-ray spectrometry","Research isotope production","Nuclear batteries"], fact:"Curium, named for Marie Curie, powered instruments on Mars — the Alpha Particle X-Ray Spectrometer on NASA's Mars rover uses curium-244 to analyze Martian rocks and soil." },
  { n:97, sym:"Bk", name:"Berkelium", cat:"actinide", g:11, p:7, mass:"[247]", state:"Solid", density:"14.79 g/cm³", mp:"986°C", bp:"Unknown", ec:"[Rn] 5f⁹ 7s²", shells:[2,8,18,32,27,8,2], en:"1.3", ox:"+4, +3", disc:"Glenn T. Seaborg et al.", year:1949, desc:"Berkelium is a radioactive transuranic element named after Berkeley, California. It serves mainly as a target material in particle accelerators to produce heavier elements. Only about a gram of berkelium-249 is produced per year globally, primarily at Oak Ridge National Laboratory, making it among the rarest materials on Earth.", uses:["Target for synthesizing element 117 (tennessine)","Nuclear research","Produces californium (irradiation)","Tracer studies","No practical applications"], fact:"Berkelium-249 was the target material used to create tennessine (element 117) — about 22 milligrams of berkelium were shipped from Oak Ridge to Russia for the experiments." },
  { n:98, sym:"Cf", name:"Californium", cat:"actinide", g:12, p:7, mass:"[251]", state:"Solid", density:"15.1 g/cm³", mp:"900°C", bp:"Unknown", ec:"[Rn] 5f¹⁰ 7s²", shells:[2,8,18,32,28,8,2], en:"1.3", ox:"+4, +3, +2", disc:"Glenn T. Seaborg et al.", year:1950, desc:"Californium is the heaviest element with practical applications. A tiny microgram of californium-252 emits 170 million neutrons per minute through spontaneous fission, making it the most intense compact neutron source available. It is used to start nuclear reactors, detect gold ore, identify water and oil in drill holes, and treat certain cancers.", uses:["Nuclear reactor startup neutron source","Neutron moisture gauges (mining)","Cancer treatment (brain/cervical)","Portable metal detector source","Neutron activation analysis"], fact:"A microgram of californium-252 — smaller than a speck of dust — emits 170 million neutrons per minute, making it one of the most concentrated neutron sources available for industry and medicine." },
  { n:99, sym:"Es", name:"Einsteinium", cat:"actinide", g:13, p:7, mass:"[252]", state:"Solid", density:"~8.84 g/cm³", mp:"860°C", bp:"Unknown", ec:"[Rn] 5f¹¹ 7s²", shells:[2,8,18,32,29,8,2], en:"1.3", ox:"+3", disc:"Lawrence Berkeley Lab", year:1952, desc:"Einsteinium was discovered in the fallout of the first hydrogen bomb test (Ivy Mike) in 1952 and secretly studied for years. Named for Albert Einstein, it is so radioactive and scarce that bulk properties have barely been measured — properties like its melting point were only precisely determined in 2021 using nanogram quantities.", uses:["Research only","Target for producing mendelevium","Spectroscopic studies","No practical applications (too rare)"], fact:"Einsteinium's melting point (860°C) was only precisely measured in 2021, 70 years after its discovery — because producing even nanogram quantities for experiments is extraordinarily difficult." },
  { n:100, sym:"Fm", name:"Fermium", cat:"actinide", g:14, p:7, mass:"[257]", state:"Solid", density:"Unknown", mp:"1527°C", bp:"Unknown", ec:"[Rn] 5f¹² 7s²", shells:[2,8,18,32,30,8,2], en:"1.3", ox:"+3", disc:"Lawrence Berkeley Lab", year:1952, desc:"Fermium was also discovered in Ivy Mike hydrogen bomb fallout and is named for Enrico Fermi, a key figure in the Manhattan Project. It is the heaviest element that can be produced in a nuclear reactor in visible quantities — elements heavier than fermium can only be made by charged particle bombardment.", uses:["Research only","No practical applications","Produces heavier elements (limited)"], fact:"Fermium marks an important boundary — it's the heaviest element that can be made in a nuclear reactor by neutron capture; all heavier elements must be made by particle accelerator bombardment." },
  { n:101, sym:"Md", name:"Mendelevium", cat:"actinide", g:15, p:7, mass:"[258]", state:"Solid", density:"Unknown", mp:"Unknown", bp:"Unknown", ec:"[Rn] 5f¹³ 7s²", shells:[2,8,18,32,31,8,2], en:"1.3", ox:"+3, +2", disc:"Seaborg, Ghiorso et al.", year:1955, desc:"Mendelevium is named for Dmitri Mendeleev, the creator of the periodic table. It was first made by bombarding einsteinium-253 with alpha particles, and the initial experiment produced just 17 atoms — yet enough to confirm the new element. It was the first element discovered one atom at a time.", uses:["Research only","No practical applications","Exotic nuclear physics studies"], fact:"The first synthesis of mendelevium produced exactly 17 atoms — science so sensitive that discovery was confirmed from fewer atoms than there are people in a small village." },
  { n:102, sym:"No", name:"Nobelium", cat:"actinide", g:16, p:7, mass:"[259]", state:"Solid", density:"Unknown", mp:"Unknown", bp:"Unknown", ec:"[Rn] 5f¹⁴ 7s²", shells:[2,8,18,32,32,8,2], en:"1.3", ox:"+3, +2", disc:"Joint Institute for Nuclear Research (JINR)", year:1966, desc:"Nobelium was named for Alfred Nobel, founder of the Nobel Prizes. Its discovery was initially disputed between American and Soviet teams during the Cold War. It is the last actinide in the periodic table to have the 5f shell fully filled, and exists only in trace synthesized quantities.", uses:["Research only","Nuclear structure studies","No practical applications"], fact:"The discovery of nobelium was disputed between American and Soviet scientists during the Cold War — the Soviets' 1966 claim was eventually confirmed as the legitimate discovery." },
  { n:103, sym:"Lr", name:"Lawrencium", cat:"actinide", g:3, p:7, mass:"[266]", state:"Solid", density:"Unknown", mp:"~1627°C", bp:"Unknown", ec:"[Rn] 5f¹⁴ 7s² 7p¹", shells:[2,8,18,32,32,8,3], en:"1.3", ox:"+3", disc:"Albert Ghiorso et al.", year:1961, desc:"Lawrencium is the last actinide and is named for Ernest Lawrence, inventor of the cyclotron particle accelerator. Its electron configuration was a matter of debate for decades due to relativistic effects confusing predictions. It marks the end of the f-block elements and the beginning of the d-block in period 7.", uses:["Research only","No practical applications"], fact:"Lawrencium's electron configuration puzzled scientists for decades — relativistic effects in heavy atoms mean that standard quantum chemistry predictions break down, and its true configuration was only resolved by experiment." },
  { n:104, sym:"Rf", name:"Rutherfordium", cat:"transition-metal", g:4, p:7, mass:"[267]", state:"Solid", density:"~23.2 g/cm³", mp:"Unknown", bp:"Unknown", ec:"[Rn] 5f¹⁴ 6d² 7s²", shells:[2,8,18,32,32,10,2], en:"Unknown", ox:"+4", disc:"JINR (Soviet) / Lawrence Berkeley (US)", year:1964, desc:"Rutherfordium is the first transactinide element and is named for Ernest Rutherford, who discovered the atomic nucleus. Like lawrencium, its discovery was disputed between Soviet and American scientists during the Cold War. It is predicted to behave chemically like hafnium, and limited experiments have confirmed this.", uses:["Research only","Nuclear physics studies","No practical applications"], fact:"Rutherfordium's discovery was so disputed between Soviet and American scientists that IUPAC temporarily called it 'unnilquadium' — a systematic Latin name meaning 1-0-4 — while the controversy was settled." },
  { n:105, sym:"Db", name:"Dubnium", cat:"transition-metal", g:5, p:7, mass:"[268]", state:"Solid", density:"~29.3 g/cm³", mp:"Unknown", bp:"Unknown", ec:"[Rn] 5f¹⁴ 6d³ 7s²", shells:[2,8,18,32,32,11,2], en:"Unknown", ox:"+5", disc:"JINR / Lawrence Berkeley", year:1967, desc:"Dubnium is named after Dubna, Russia, home of the Joint Institute for Nuclear Research (JINR) where the element was first produced. It is only available in atom-by-atom quantities and decays within hours. Chemical studies show it behaves like tantalum/niobium, consistent with its position in the periodic table.", uses:["Research only","Fundamental physics studies","No practical applications"], fact:"Dubnium atoms are so short-lived that chemists must run experiments within seconds of creating each atom — sometimes studying fewer than 100 atoms total to determine chemical properties." },
  { n:106, sym:"Sg", name:"Seaborgium", cat:"transition-metal", g:6, p:7, mass:"[269]", state:"Solid", density:"~35.0 g/cm³", mp:"Unknown", bp:"Unknown", ec:"[Rn] 5f¹⁴ 6d⁴ 7s²", shells:[2,8,18,32,32,12,2], en:"Unknown", ox:"+6", disc:"Lawrence Berkeley National Lab", year:1974, desc:"Seaborgium is named after Glenn T. Seaborg, who co-discovered ten transuranic elements and co-won the Nobel Prize in Chemistry in 1951. He is one of the very few people to have an element named after them while still alive. It was made by bombarding californium with oxygen ions.", uses:["Research only","No practical applications"], fact:"Glenn Seaborg is one of only two people to have an element named after them while still alive — receiving the news of seaborgium's official naming in 1994, when he was 82 years old." },
  { n:107, sym:"Bh", name:"Bohrium", cat:"transition-metal", g:7, p:7, mass:"[270]", state:"Solid", density:"~37.1 g/cm³", mp:"Unknown", bp:"Unknown", ec:"[Rn] 5f¹⁴ 6d⁵ 7s²", shells:[2,8,18,32,32,13,2], en:"Unknown", ox:"+7", disc:"GSI Helmholtz Centre, Darmstadt", year:1981, desc:"Bohrium is named after Niels Bohr, the Danish physicist who proposed the quantum model of the atom. Made by bombarding bismuth with chromium ions, it exists only in atom-by-atom quantities with a half-life of seconds to minutes. Its chemistry is consistent with being a heavier homolog of rhenium.", uses:["Research only","No practical applications"], fact:"Bohrium was first created at the GSI facility in Darmstadt, Germany, which has become one of the world's premier laboratories for creating superheavy elements — also discovering elements 107-112." },
  { n:108, sym:"Hs", name:"Hassium", cat:"transition-metal", g:8, p:7, mass:"[277]", state:"Solid", density:"~41.0 g/cm³", mp:"Unknown", bp:"Unknown", ec:"[Rn] 5f¹⁴ 6d⁶ 7s²", shells:[2,8,18,32,32,14,2], en:"Unknown", ox:"+8", disc:"GSI Helmholtz Centre, Darmstadt", year:1984, desc:"Hassium is named after Hesse (Hassia), the German state where GSI is located. It is predicted to be the heaviest element that can form a stable tetroxide (HsO₄), and an experiment in 2002 successfully formed and measured this volatile compound, confirming hassium's place as a group 8 element like iron, ruthenium, and osmium.", uses:["Research only","No practical applications"], fact:"Hasssium tetroxide (HsO₄) was successfully created and measured in 2002 using just a few atoms — one of the few superheavy element compounds ever synthesized and characterized." },
  { n:109, sym:"Mt", name:"Meitnerium", cat:"transition-metal", g:9, p:7, mass:"[278]", state:"Solid", density:"~37.4 g/cm³", mp:"Unknown", bp:"Unknown", ec:"[Rn] 5f¹⁴ 6d⁷ 7s²", shells:[2,8,18,32,32,15,2], en:"Unknown", ox:"+6, +3", disc:"GSI Helmholtz Centre, Darmstadt", year:1982, desc:"Meitnerium is named after Lise Meitner, the Austrian-Swedish physicist who co-discovered nuclear fission with Otto Hahn. Despite being equally deserving, she was famously excluded from the 1944 Nobel Prize given to Hahn. The naming of element 109 in her honor is considered a posthumous recognition of this injustice.", uses:["Research only","No practical applications"], fact:"Lise Meitner co-discovered nuclear fission but was passed over for the Nobel Prize given to her collaborator Otto Hahn in 1944 — meitnerium honors this scientific injustice 50 years later." },
  { n:110, sym:"Ds", name:"Darmstadtium", cat:"transition-metal", g:10, p:7, mass:"[281]", state:"Solid", density:"~34.8 g/cm³", mp:"Unknown", bp:"Unknown", ec:"[Rn] 5f¹⁴ 6d⁹ 7s¹", shells:[2,8,18,32,32,17,1], en:"Unknown", ox:"+8, +6, +4, +2, 0", disc:"GSI Helmholtz Centre, Darmstadt", year:1994, desc:"Darmstadtium is named after Darmstadt, Germany. It exists for only milliseconds before decaying. It is predicted to be a noble metal like platinum and gold in its chemistry, though this has never been experimentally verified due to the extreme difficulty of working with single atoms that decay almost instantly.", uses:["Research only","No practical applications"], fact:"Darmstadtium decays within microseconds to milliseconds, meaning every atom ever created has long since decayed — only its radioactive decay products exist to prove it was once there." },
  { n:111, sym:"Rg", name:"Roentgenium", cat:"transition-metal", g:11, p:7, mass:"[282]", state:"Solid", density:"~28.7 g/cm³", mp:"Unknown", bp:"Unknown", ec:"[Rn] 5f¹⁴ 6d¹⁰ 7s¹", shells:[2,8,18,32,32,18,1], en:"Unknown", ox:"+5, +3, +1, -1", disc:"GSI Helmholtz Centre, Darmstadt", year:1994, desc:"Roentgenium is named after Wilhelm Röntgen, the discoverer of X-rays. Relativistic effects are predicted to make roentgenium behave differently from its lighter congeners gold and silver — it may have a higher electron affinity than any other element, potentially making it act somewhat like a halogen in some respects.", uses:["Research only","No practical applications"], fact:"Relativistic effects in roentgenium are so extreme that it may have a higher electron affinity than any other element — meaning it might attract electrons more strongly than even fluorine in some compounds." },
  { n:112, sym:"Cn", name:"Copernicium", cat:"transition-metal", g:12, p:7, mass:"[285]", state:"Gas/Liquid", density:"~14.0 g/cm³", mp:"Unknown", bp:"Unknown (possibly ~84°C)", ec:"[Rn] 5f¹⁴ 6d¹⁰ 7s²", shells:[2,8,18,32,32,18,2], en:"Unknown", ox:"+4, +2, 0", disc:"GSI Helmholtz Centre, Darmstadt", year:1996, desc:"Copernicium is named after Nicolaus Copernicus. Due to extreme relativistic effects, copernicium may actually be a gas or liquid at room temperature, unlike all its group 12 relatives (zinc, cadmium, mercury are solids or liquids). It might behave more like a noble gas than a transition metal.", uses:["Research only","No practical applications"], fact:"Copernicium may be a gas at room temperature due to relativistic quantum effects so extreme they completely alter its chemical behavior, making it behave like a noble gas rather than a metal." },
  { n:113, sym:"Nh", name:"Nihonium", cat:"post-transition", g:13, p:7, mass:"[286]", state:"Solid", density:"~16.0 g/cm³", mp:"Unknown (~430°C predicted)", bp:"Unknown", ec:"[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p¹", shells:[2,8,18,32,32,18,3], en:"Unknown", ox:"+3, +1", disc:"RIKEN (Japan)", year:2004, desc:"Nihonium is the first element discovered in Asia, created at RIKEN institute in Japan. Its name comes from 'Nihon' (Japan). The synthesis required nine years of experiments (2004-2012) to produce enough decay chains to meet the criteria for official recognition. It was officially named in 2016.", uses:["Research only","No practical applications"], fact:"Nihonium took 9 years of experiments to produce enough confirmed decay chains for official recognition — making its discovery one of the most painstaking in the history of chemistry." },
  { n:114, sym:"Fl", name:"Flerovium", cat:"post-transition", g:14, p:7, mass:"[289]", state:"Solid (possibly gas)", density:"~14.0 g/cm³", mp:"Unknown", bp:"Unknown", ec:"[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p²", shells:[2,8,18,32,32,18,4], en:"Unknown", ox:"+6, +4, +2, 0", disc:"JINR, Russia", year:1998, desc:"Flerovium is named after the Flerov Laboratory of Nuclear Reactions at JINR, Russia, which was itself named after physicist Georgy Flyorov. Relativistic effects may make flerovium behave like a noble gas, and experiments suggest it is extremely volatile and noble-metal-like. It may lie near the 'island of stability' for superheavy nuclei.", uses:["Research only","No practical applications"], fact:"Flerovium may sit near the theoretical 'island of stability' — a predicted region of superheavy nuclei with unusually long half-lives, potentially stable enough to be isolated and studied in bulk." },

const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');
let stars = [];
function resizeStarfield() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
function initStars() {
  stars = [];
  for (let i = 0; i < 200; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.5,
      a: Math.random(),
      speed: 0.0003 + Math.random() * 0.001
    });
  }
}
function drawStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const t = Date.now();
  stars.forEach(s => {
    const alpha = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * s.speed + s.a * 100));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200,220,255,${alpha})`;
    ctx.fill();
  });
  requestAnimationFrame(drawStars);
}
resizeStarfield();
initStars();
drawStars();

function filterElements(query, category) {
  const q = query.toLowerCase().trim();
  const cells = document.querySelectorAll('.element-cell');
  let shown = 0;
  cells.forEach(cell => {
    const n = parseInt(cell.dataset.n);
    const el = ELEMENTS[n - 1];
    const matchQ = !q || el.name.toLowerCase().includes(q) || el.sym.toLowerCase().includes(q) || String(el.n).includes(q);
    const matchC = category === 'all' || el.cat === category;
    if (matchQ && matchC) {
      cell.classList.remove('dimmed');
      cell.classList.add('highlighted');
      shown++;
    } else {
      cell.classList.add('dimmed');
      cell.classList.remove('highlighted');
    }
  });
  const countEl = document.getElementById('counterBar');
  countEl.innerHTML = `Showing <span>${shown}</span> of 118 elements`;
}

// ── 3D ATOM MODEL (Three.js) ──
function destroyAtom() {
  if (atomAnimId) { cancelAnimationFrame(atomAnimId); atomAnimId = null; }
  if (atomRenderer) { atomRenderer.dispose(); atomRenderer = null; }
  atomScene = null;
}

function init3DAtom(el) {
  destroyAtom();
  const container = document.querySelector('.modal-3d');
  const canvas3d = document.getElementById('atomCanvas');
  const W = container.clientWidth || 300;
  const H = container.clientHeight || 200;

  atomScene = new THREE.Scene();
  atomCamera = new THREE.PerspectiveCamera(60, W / H, 0.1, 100);
  atomCamera.position.z = 4.5;

  atomRenderer = new THREE.WebGLRenderer({ canvas: canvas3d, alpha: true, antialias: true });
  atomRenderer.setSize(W, H);
  atomRenderer.setPixelRatio(window.devicePixelRatio);
  atomRenderer.setClearColor(0x000000, 0);

  const color = categoryColor(el.cat);
  const cVal = parseInt(color.replace('#', ''), 16);

  // Lighting
  const ambLight = new THREE.AmbientLight(0xffffff, 0.4);
  atomScene.add(ambLight);
  const ptLight = new THREE.PointLight(cVal, 2, 20);
  ptLight.position.set(3, 3, 3);
  atomScene.add(ptLight);
  const ptLight2 = new THREE.PointLight(0xffffff, 1, 20);
  ptLight2.position.set(-3, -2, 2);
  atomScene.add(ptLight2);

  // Nucleus
  const protons = el.n;
  const nucleusGroup = new THREE.Group();
  const nucleonCount = Math.min(protons, 20);
  const nMat = new THREE.MeshPhongMaterial({ color: cVal, emissive: cVal, emissiveIntensity: 0.3, shininess: 80 });
  for (let i = 0; i < nucleonCount; i++) {
    const nGeo = new THREE.SphereGeometry(0.07 + Math.random() * 0.04, 8, 8);
    const nMesh = new THREE.Mesh(nGeo, nMat);
    const phi = Math.acos(2 * Math.random() - 1);
    const theta = 2 * Math.PI * Math.random();
    const r = 0.15 * Math.cbrt(nucleonCount);
    nMesh.position.set(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
    nucleusGroup.add(nMesh);
  }
  atomScene.add(nucleusGroup);

  // Nucleus glow sphere
  const glowGeo = new THREE.SphereGeometry(0.28, 16, 16);
  const glowMat = new THREE.MeshBasicMaterial({ color: cVal, transparent: true, opacity: 0.12 });
  atomScene.add(new THREE.Mesh(glowGeo, glowMat));

  // Electron shells
  const shellData = el.shells;
  const orbits = [];
  const electrons = [];

  shellData.forEach((count, shellIdx) => {
    const radius = 0.7 + shellIdx * 0.65;

    // Orbit ring (torus)
    const torusGeo = new THREE.TorusGeometry(radius, 0.012, 8, 80);
    // Randomize orbit tilt per shell
    const tiltX = (shellIdx * 0.7 + 0.3) % (Math.PI);
    const tiltZ = (shellIdx * 1.1 + 0.5) % (Math.PI * 0.6);
    const torusMat = new THREE.MeshBasicMaterial({ color: cVal, transparent: true, opacity: 0.25 });
    const torus = new THREE.Mesh(torusGeo, torusMat);
    torus.rotation.x = tiltX;
    torus.rotation.z = tiltZ;
    atomScene.add(torus);
    orbits.push({ mesh: torus, rotX: tiltX, rotZ: tiltZ, radius });

    // Electrons on this shell
    const maxElec = Math.min(count, 4);
    for (let e2 = 0; e2 < maxElec; e2++) {
      const eGeo = new THREE.SphereGeometry(0.06, 8, 8);
      const eMat = new THREE.MeshPhongMaterial({ color: 0xffffff, emissive: cVal, emissiveIntensity: 0.8, shininess: 100 });
      const eMesh = new THREE.Mesh(eGeo, eMat);
      const startAngle = (2 * Math.PI * e2) / maxElec;
      const speed = 0.8 + shellIdx * 0.15 + Math.random() * 0.3;
      electrons.push({ mesh: eMesh, shell: shellIdx, radius, angle: startAngle, speed, tiltX, tiltZ });
      atomScene.add(eMesh);
    }
  });

  // Animate
  let t = 0;
  function animate() {
    atomAnimId = requestAnimationFrame(animate);
    t += 0.016;
    nucleusGroup.rotation.y = t * 0.5;
    nucleusGroup.rotation.x = t * 0.3;

    electrons.forEach(e2 => {
      e2.angle += e2.speed * 0.016;
      const x = e2.radius * Math.cos(e2.angle);
      const y = e2.radius * Math.sin(e2.angle);
      // Apply orbit tilt
      const cosX = Math.cos(e2.tiltX), sinX = Math.sin(e2.tiltX);
      const cosZ = Math.cos(e2.tiltZ), sinZ = Math.sin(e2.tiltZ);
      const y1 = y * cosX;
      const z1 = y * sinX;
      const x2 = x * cosZ - z1 * sinZ;
      const y2 = x * sinZ + z1 * cosZ;
      e2.mesh.position.set(x2, y1, y2);
    });

    atomScene.rotation.y = t * 0.1;
    atomRenderer.render(atomScene, atomCamera);
  }
  animate();
}

// ── SCROLL TOP ──
const scrollBtn = document.getElementById('scrollTop');
window.addEventListener('scroll', () => {
  scrollBtn.classList.toggle('visible', window.scrollY > 300);
});
scrollBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
</script>
